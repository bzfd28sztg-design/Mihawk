<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI — Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
.app{height:100vh;display:flex;background:radial-gradient(circle at 70% 10%,#18202d 0,transparent 32%),#050505}
.sidebar{width:260px;border-right:1px solid #1c1c1c;background:rgba(8,8,8,.9);padding:18px;display:flex;flex-direction:column}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:22px}.logo span{color:#8b5cf6}
.new{border:1px solid #2a2a2a;background:#111;border-radius:12px;color:#fff;padding:12px;cursor:pointer;font-weight:650}
.new:hover{background:#181818}.side-title{font-size:11px;color:#666;text-transform:uppercase;margin:25px 8px 8px;letter-spacing:1px}
.chat-item{padding:10px;border-radius:9px;color:#aaa;font-size:14px;cursor:pointer}.chat-item.active,.chat-item:hover{background:#151515;color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:62px;border-bottom:1px solid #191919;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.model{font-weight:700}.status{font-size:12px;color:#7ee787}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#39d353;margin-right:7px}
.messages{flex:1;overflow:auto;padding:34px 18px 160px}.wrap{max-width:820px;margin:auto}
.hero{text-align:center;padding:12vh 10px 30px}.orb{width:68px;height:68px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);box-shadow:0 0 50px #6d28d955;display:grid;place-items:center;font-size:30px}.hero h1{font-size:34px;margin:22px 0 8px}.hero p{color:#888;margin:0}
.msg{display:flex;gap:13px;margin:25px 0;line-height:1.6}.avatar{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800}.ai{background:linear-gradient(135deg,#8b5cf6,#22d3ee)}.user{background:#252525}.bubble{max-width:720px;white-space:pre-wrap;color:#ddd}.userbubble{background:#151515;border:1px solid #232323;padding:11px 14px;border-radius:15px;color:#fff}
.composer{position:fixed;bottom:0;left:260px;right:0;padding:18px;background:linear-gradient(transparent,#050505 35%)}.box{max-width:820px;margin:auto;border:1px solid #292929;background:#101010;border-radius:17px;display:flex;align-items:flex-end;padding:10px;box-shadow:0 10px 40px #000}
textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;padding:10px;font:inherit;min-height:44px;max-height:140px}
.send{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:800;cursor:pointer}.send:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:#555;font-size:11px;margin-top:8px}
@media(max-width:700px){.sidebar{display:none}.composer{left:0}.top{padding:0 15px}.messages{padding-left:12px;padding-right:12px}.hero{padding-top:10vh}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Nova<span>AI</span></div>
  <button class="new" onclick="newChat()">＋ New chat</button>
  <div class="side-title">Recent</div>
  <div class="chat-item active">AI Assistant</div>
  <div class="chat-item">Ideas & questions</div>
  <div class="chat-item">Help me plan</div>
  <div style="margin-top:auto;color:#555;font-size:12px;padding:8px">Frontend demo · Connect your AI API to make replies real.</div>
</aside>
<main class="main">
  <header class="top"><div class="model">Nova Assistant</div><div class="status"><span class="dot"></span>Online</div></header>
  <section class="messages" id="messages"><div class="wrap" id="wrap">
    <div class="hero" id="hero"><div class="orb">✦</div><h1>How can I help?</h1><p>Ask me anything, brainstorm ideas, or get help with a task.</p></div>
  </div></section>
  <div class="composer">
    <div class="box"><textarea id="input" rows="1" placeholder="Message Nova AI..." oninput="resizeBox(this)" onkeydown="keySend(event)"></textarea><button class="send" id="send" onclick="send()">↑</button></div>
    <div class="hint">Enter to send · Shift + Enter for a new line</div>
  </div>
</main>
</div>
<script>
const input=document.getElementById('input'), wrap=document.getElementById('wrap'), hero=document.getElementById('hero'), sendBtn=document.getElementById('send');
function resizeBox(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';sendBtn.disabled=!el.value.trim()}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function addMsg(text,who){
 const row=document.createElement('div'); row.className='msg';
 row.innerHTML='<div class="avatar '+(who==='ai'?'ai':'user')+'">'+(who==='ai'?'✦':'You')+'</div><div class="bubble '+(who==='user'?'userbubble':'')+'"></div>';
 row.querySelector('.bubble').textContent=text; wrap.appendChild(row);
 document.querySelector('.messages').scrollTop=999999;
}
function newChat(){wrap.innerHTML=''; const h=document.createElement('div');h.className='hero';h.innerHTML='<div class="orb">✦</div><h1>How can I help?</h1><p>Ask me anything, brainstorm ideas, or get help with a task.</p>';wrap.appendChild(h);input.value='';resizeBox(input)}
async function send(){
 const text=input.value.trim(); if(!text)return;
 if(hero)hero.remove(); addMsg(text,'user'); input.value=''; resizeBox(input); sendBtn.disabled=true;
 const loading=document.createElement('div');loading.className='msg';loading.innerHTML='<div class="avatar ai">✦</div><div class="bubble">Thinking…</div>';wrap.appendChild(loading);
 setTimeout(()=>{
   loading.remove();
   addMsg("I’m ready to help. This page is the chat interface; to get real AI responses, connect the send() function to your preferred AI API and keep the API key on a secure server.",'ai');
   sendBtn.disabled=false; input.focus();
 },700);
}
resizeBox(input);
</script>
</body>
</html>
